<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biology EOC Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunk:#EEF1F5; --ink:#1B1F27; --muted:#5B6372; --line:#D9DEE6;
  --gold:#B8901C;
  --d1:#1F5F4A; --d2:#8E2C2C; --d3:#5B3A70; --d4:#2F6B2F; --d5:#1F5A8B;
  --d1t:#E3F0EB; --d2t:#F5E7E7; --d3t:#EEE7F3; --d4t:#E6F0E3; --d5t:#E3ECF5;
  --ok:#2E7D4F; --oksoft:#E3F3E9; --warn:#A86A00; --warnsoft:#FDF1DC; --bad:#B23A3A; --badsoft:#FBE6E6;
  --f-display:"Zilla Slab", Rockwell, Georgia, serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#12151B; --surface:#1A1F27; --sunk:#232A34; --ink:#E8EBF0; --muted:#A3ACBA; --line:#323B48;
  --gold:#E2BC4E;
  --d1:#8CCBB3; --d2:#E39A9A; --d3:#C3A3DD; --d4:#9FCF94; --d5:#8FB8E3;
  --d1t:#1C2D27; --d2t:#33201F; --d3t:#2A2133; --d4t:#1F2C1C; --d5t:#1C2636;
  --ok:#6FCB95; --oksoft:#1B3326; --warn:#F0B95A; --warnsoft:#3A2E17; --bad:#F08A8A; --badsoft:#3A1F1F;
  color-scheme:dark }}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between;margin-bottom:18px}
.mast h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:700}
.who{font-size:.9rem;color:var(--muted);text-align:right}
.who b{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}

/* sign-in */
.gate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:560px;display:grid;gap:14px}
.gate label{display:grid;gap:4px;font-weight:600}
.gate input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gate .row{display:grid;grid-template-columns:1fr 120px;gap:12px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}

/* blueprint nav */
.bp{display:flex;gap:4px;margin:8px 0 6px}
.seg{position:relative;border:0;border-radius:8px;padding:12px 12px 14px;text-align:left;color:#fff;min-width:0;display:grid;gap:2px;transition:transform .15s}
.seg .pct{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1}
.seg .nm{font-size:.82rem;font-weight:600;line-height:1.2}
.seg .done{position:absolute;top:8px;right:10px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.9);color:#1b1b1b;border-radius:999px;padding:1px 7px}
.seg[aria-current="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--gold)}
.seg:hover{transform:translateY(-2px)}
.s1{flex:20;background:#1F5F4A}.s2{flex:23;background:#8E2C2C}.s3{flex:13;background:#5B3A70}.s4{flex:27;background:#2F6B2F}.s5{flex:17;background:#1F5A8B}
.bpnote{font-size:.85rem;color:var(--muted);margin-bottom:22px}
@media (max-width:640px){ .bp{flex-direction:column}.seg{flex:auto!important;grid-template-columns:3.6rem 1fr;align-items:center}.seg .pct{font-size:1.25rem} }

/* domain */
.dhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--dc);padding-bottom:12px;margin-bottom:16px}
.dhead h2{font-size:clamp(1.5rem,3.6vw,2.1rem);color:var(--dc)}
.dstats{display:flex;gap:18px;font-size:.9rem;color:var(--muted)}
.dstats b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:600}
.tab[aria-selected="true"]{background:var(--dc);border-color:var(--dc);color:var(--surface)}
.tab.results{margin-left:auto;border-color:var(--gold)}
.tab.results[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#1b1b1b}

.keybox{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:var(--r);padding:16px 20px}
.keybox ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:8px;max-width:75ch}
.elist{display:grid;gap:8px;margin-top:16px}
.erow{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.code{font-family:var(--f-mono);font-size:.8rem;background:var(--dt);color:var(--dc);padding:3px 8px;border-radius:6px;white-space:nowrap}

.elh{display:flex;gap:10px;align-items:center;margin:26px 0 10px}
.elh h3{font-size:1.1rem;font-weight:600}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:14px;display:grid;gap:10px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--dc)}
.tag{font-size:.78rem;color:var(--muted);font-weight:600}
.mark{margin-left:auto;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px}
.m-ok{background:var(--oksoft);color:var(--ok)} .m-bad{background:var(--badsoft);color:var(--bad)}
.stem{max-width:75ch}
.stem p{margin:0 0 6px}
.lead{background:var(--dt);border-radius:8px;padding:12px 14px}
.scratch{font-size:.88rem;color:var(--muted);font-style:italic}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;font-size:.92rem;margin:4px 0}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center}
th{background:var(--dc);color:var(--surface);font-weight:600}
td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(odd) td{background:var(--sunk)}
.opts{display:grid;gap:8px;margin:0;padding:0;border:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--dc)}
.opt input{margin-top:5px;accent-color:var(--dc)}
.opt .L{font-weight:700;margin-right:6px}
.opt.picked-ok{border-color:var(--ok);background:var(--oksoft)} .opt.picked-bad{border-color:var(--bad);background:var(--badsoft)}
.hint{font-size:.88rem;font-weight:700;color:var(--dc)}
.ord{display:grid;gap:6px}
.ordrow{display:grid;grid-template-columns:2rem 1fr;gap:8px;align-items:start}
.ordrow b{color:var(--dc)}
.ordsel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;font-weight:600}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.submitbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;background:var(--dc);color:var(--surface);font-weight:700;padding:10px 20px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--dc);border:1px solid var(--dc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:.88rem;color:var(--muted)}

/* results */
.banner{border-radius:var(--r);padding:14px 18px;margin-bottom:16px;display:grid;gap:4px}
.banner.ok{background:var(--oksoft)} .banner.warn{background:var(--warnsoft)} .banner.bad{background:var(--badsoft)}
.banner b{font-size:1.05rem}
.rdom{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
.rdom h3{color:var(--dc);font-size:1.15rem;margin-bottom:8px}
.rrow{display:grid;grid-template-columns:5.2rem 1fr 3.5rem 7.5rem;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.93rem}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--dc);border-color:var(--dc)}
.pill{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;text-align:center}
.p-sec{background:var(--oksoft);color:var(--ok)} .p-dev{background:var(--warnsoft);color:var(--warn)} .p-int{background:var(--badsoft);color:var(--bad)} .p-none{background:var(--sunk);color:var(--muted)}
.rname{color:var(--muted)}
@media (max-width:560px){ .rrow{grid-template-columns:4.6rem 1fr 3rem}.rrow .pill{grid-column:2/4;justify-self:start} .rrow .rname{grid-column:1/-1} }
.sendstate{font-size:.88rem;font-weight:600}
.foot{margin-top:40px;font-size:.8rem;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app" style="--dc:var(--d1);--dt:var(--d1t)">
  <header class="mast">
    <div><div class="eyebrow">Georgia Milestones · Biology End-of-Course</div><h1>Biology EOC Study Guide</h1></div>
    <div class="who" id="who"></div>
  </header>
  <main id="main"></main>
  <p class="foot">Built from the GaDOE Biology Standards, Teacher Notes, Achievement Level Descriptors, and Milestones Biology Blueprint (July 2025). Your answers save in this browser. When you submit a domain, your scores go to your teacher.</p>
</div>

<script>
// Paste the Apps Script web app URL (ends in /exec) between the quotes.
const SHEETS_URL = "__SHEETS_URL__";

const DATA = [{"num": 1, "title": "Cells", "stds": "SB1", "count": 15, "key": ["Organelles work as a system: ribosomes build proteins, the ER moves them, the Golgi packages them, vesicles ship them, mitochondria supply ATP, and the cell membrane controls what enters and leaves. Together they maintain homeostasis.", "Mitosis and binary fission make genetically identical cells. Meiosis makes 4 gametes with half the chromosomes, and fertilization restores the full number. Both keep genetic continuity.", "Structure fits function in macromolecules: carbohydrates (quick energy, structure), lipids (long-term energy, membranes, insulation), proteins built from amino acids (enzymes, transport, structure), nucleic acids (store and transmit genetic information).", "Enzymes are proteins with a specific shape. High temperature or the wrong pH changes the shape (denatures it), so the substrate no longer fits.", "Passive transport (diffusion, facilitated diffusion, osmosis) moves from high to low concentration with no energy. Active transport uses ATP to move against the gradient.", "Photosynthesis: light reactions split water and release O₂; the Calvin cycle uses CO₂ to build glucose. Respiration: glycolysis (cytoplasm), Krebs cycle (releases CO₂), electron transport chain (uses O₂, makes most ATP and water)."], "elements": [{"code": "SB1a", "title": "Cell structures work together to maintain homeostasis", "short": "Organelles and homeostasis", "items": [{"n": 1, "stem": "A pancreas cell makes large amounts of the protein insulin and releases it into the blood. Which pathway shows how the protein is made and shipped out of the cell?", "opts": ["nucleus → Golgi apparatus → ribosome → lysosome", "ribosome on rough ER → endoplasmic reticulum → Golgi apparatus → vesicle → cell membrane", "mitochondria → ribosome → vacuole → cell wall", "cell membrane → vesicle → Golgi apparatus → ribosome"], "type": "mc", "k": "IkIi"}, {"n": 2, "stem": "Cells lining the small intestine use active transport to absorb nutrients all day. Compared with most other body cells, these cells most likely have more of which organelle?", "opts": ["lysosomes", "chloroplasts", "mitochondria", "central vacuoles"], "type": "mc", "k": "IkMi"}, {"n": 3, "stem": "A mutation stops a cell's lysosomes from working. Which outcome is most likely?", "opts": ["Worn-out organelles and wastes build up because nothing breaks them down, which disrupts homeostasis.", "The cell stops making proteins because lysosomes contain the ribosomes.", "The cell cannot release energy because lysosomes carry out cellular respiration.", "The cell fills with water because lysosomes control the cell membrane."], "type": "mc", "k": "IkEi"}]}, {"code": "SB1b", "title": "Cell reproduction maintains genetic continuity", "short": "Cell reproduction", "items": [{"n": 4, "stem": "A human skin cell has 46 chromosomes and divides by mitosis. How many chromosomes are in each daughter cell?", "opts": ["92", "23", "12", "46"], "type": "mc", "k": "IkQi"}, {"n": 5, "stem": "Which statement best explains how meiosis maintains genetic continuity from one generation to the next?", "opts": ["It produces four identical body cells for growth and repair.", "It doubles the chromosome number so offspring have more genes.", "It halves the chromosome number in gametes, so fertilization restores the species' full chromosome number.", "It copies the parent cell exactly, so offspring are clones of one parent."], "type": "mc", "k": "IkMi"}, {"n": 6, "stem": "A bacterium reproduces by binary fission. Use the menus to put the steps in order.", "opts": [["W", "The cell grows longer."], ["X", "A wall (septum) forms and splits the cell into two."], ["Y", "The DNA is copied."], ["Z", "The two copies of DNA move to opposite ends of the cell."]], "type": "order", "k": "IlksIFcsIFosIFgi"}]}, {"code": "SB1c", "title": "Macromolecule structure relates to function", "short": "Macromolecules", "items": [{"n": 7, "stem": "Which macromolecule is built from amino acids and includes enzymes?", "opts": ["carbohydrates", "lipids", "nucleic acids", "proteins"], "type": "mc", "k": "IkQi"}, {"n": 8, "stem": "A student measured the reaction rate of an enzyme at different temperatures.", "table": {"header": ["Temperature (°C)", "20", "30", "37", "45", "55", "65"], "rows": [["Reaction rate (units/min)", "12", "25", "40", "30", "8", "0"]]}, "q": "Which claim is best supported by the data?", "opts": ["The enzyme works fastest at the highest temperature tested.", "Above about 37°C the enzyme's shape changes, so the substrate fits poorly and the rate drops.", "The enzyme is used up in the reaction as the temperature rises.", "Temperature has no effect on how this enzyme works."], "type": "mc", "k": "IkIi"}, {"n": 9, "stem": "Seals have a thick layer of blubber under their skin. Which explanation correctly relates the structure of blubber to its function?", "opts": ["Blubber is mostly lipid; its many carbon-hydrogen bonds store a lot of energy per gram, and the layer insulates the seal.", "Blubber is mostly carbohydrate, which stores the seal's genetic information.", "Blubber is mostly protein, which speeds up chemical reactions in cold water.", "Blubber is mostly nucleic acid, which builds the seal's cell walls."], "type": "mc", "k": "IkEi"}]}, {"code": "SB1d", "title": "Cell transport maintains homeostasis", "short": "Cell transport", "items": [{"n": 10, "stem": "Red blood cells placed in a salt solution shrivel. Which describes the solution and the movement of water?", "opts": ["hypotonic; water moved into the cells", "isotonic; there was no net movement of water", "hypertonic; water moved out of the cells", "hypotonic; salt moved into the cells"], "type": "mc", "k": "IkMi"}, {"n": 11, "stem": "A student placed potato cubes of equal mass in four salt solutions for 24 hours.", "table": {"header": ["Salt concentration", "0%", "2%", "4%", "6%"], "rows": [["Change in mass", "+8%", "+2%", "-4%", "-9%"]]}, "q": "Which conclusion is best supported?", "opts": ["The potato cells are isotonic to a salt solution somewhere between 2% and 4%.", "Salt moved into the potato cubes in every solution.", "The potato cells used active transport to gain water in the 0% solution.", "The potato cells are isotonic to the 6% solution."], "type": "mc", "k": "IkEi"}, {"n": 12, "stem": "Nerve cells keep more sodium outside the cell than inside by pumping sodium against its concentration gradient. Which type of transport is this, and what does it require?", "opts": ["diffusion; no energy", "osmosis; no energy", "facilitated diffusion; channel proteins only", "active transport; energy from ATP"], "type": "mc", "k": "IkQi"}]}, {"code": "SB1e", "title": "Photosynthesis and respiration cycle matter and move energy", "short": "Photosynthesis and respiration", "items": [{"n": 13, "stem": "Which stage of cellular respiration requires oxygen and produces the most ATP?", "opts": ["glycolysis", "electron transport chain", "Krebs cycle", "Calvin cycle"], "type": "mc", "k": "IkIi"}, {"n": 14, "stem": "A single-celled alga is kept in bright light. Which statement correctly traces matter through photosynthesis?", "opts": ["The light reactions split water and release O₂; the Calvin cycle uses CO₂ to build glucose.", "The Calvin cycle releases O₂; the light reactions use CO₂ to build glucose.", "Glycolysis in the chloroplast splits water and makes O₂.", "The alga only photosynthesizes and never carries out cellular respiration."], "type": "mc", "k": "IkEi"}, {"n": 15, "stem": "A student asks, \"Does an alga still release CO₂ in the dark?\" She seals algae in flasks and measures CO₂.", "table": {"header": ["Condition", "CO₂ in the flask after 2 hours"], "rows": [["Bright light", "decreased"], ["Darkness", "increased"]]}, "q": "Which explanation is best supported?", "opts": ["Algae carry out cellular respiration only when light is present.", "In the dark, the algae carry out photosynthesis faster than respiration.", "In the dark only respiration occurs, releasing CO₂; in light, photosynthesis uses more CO₂ than respiration releases.", "CO₂ increases in the dark because the Calvin cycle releases it."], "type": "mc", "k": "IkMi"}]}]}, {"num": 2, "title": "Cellular Genetics and Heredity", "stds": "SB2, SB3", "count": 18, "key": ["DNA is double stranded with base pairs A-T and G-C. In replication, each strand is a template, so both new copies match the original.", "Transcription makes mRNA from DNA (U replaces T). Translation at the ribosome reads mRNA in 3-base codons; tRNA brings the matching amino acids to build a protein.", "Inheritable variation comes from meiosis (crossing over, independent assortment, nondisjunction), replication errors (insertion, deletion, substitution), and mutagens (radiation, chemicals, viruses). Only mutations in gametes pass to offspring.", "Biotechnology (gel electrophoresis, DNA fingerprinting, plasmids, GMOs, cloning) works because all organisms share the same genetic code. Each use brings benefits and ethical or environmental questions.", "Mendel's law of segregation: the two alleles for a trait separate into different gametes. Law of independent assortment: genes on different chromosomes sort separately.", "Inheritance patterns: dominance (Bb shows the dominant trait), incomplete dominance (blend, such as pink from red and white), codominance (both show, such as roan cattle). Bb x Bb gives a 3:1 phenotype ratio; a dihybrid cross of two double heterozygotes gives 9:3:3:1.", "Asexual reproduction is fast and needs no mate but makes clones. Sexual reproduction is slower and costs more energy but creates variation that helps populations survive change."], "elements": [{"code": "SB2a", "title": "DNA and RNA structure lead to protein expression", "short": "DNA, RNA, protein expression", "items": [{"n": 16, "stem": "A DNA template strand reads <b>TAC GGA</b>. What is the mRNA strand transcribed from it?", "opts": ["ATG CCT", "UAC GGA", "AUG CCU", "TAC CCU"], "type": "mc", "k": "IkMi"}, {"n": 17, "stem": "Use the codon chart to translate this mRNA: <b>AUG UUU GGC</b>", "table": {"header": ["Codon", "AUG", "UUU", "UUA", "GGC", "GGA", "UAA"], "rows": [["Amino acid", "Met (start)", "Phe", "Leu", "Gly", "Gly", "Stop"]]}, "opts": ["Met - Leu - Gly", "Met - Phe - Gly", "Phe - Met - Gly", "Met - Phe - Stop"], "type": "mc", "k": "IkIi"}, {"n": 18, "stem": "Which feature of DNA's structure allows it to be copied accurately before a cell divides?", "opts": ["It is a single strand that contains uracil.", "It is made of amino acids joined by peptide bonds.", "Its phosphate groups pair with sugars across the two strands.", "Complementary base pairing (A with T, G with C) lets each strand serve as a template for a new strand."], "type": "mc", "k": "IkQi"}]}, {"code": "SB2b", "title": "Sources of inheritable genetic variation", "short": "Sources of genetic variation", "items": [{"n": 19, "stem": "A section of DNA changes from <b>GCA</b> to <b>GCC</b>. Both codons code for the amino acid alanine. Which describes this mutation and its most likely effect?", "opts": ["substitution; the protein is most likely unchanged because the amino acid is the same", "insertion; every codon after it shifts, so the protein does not work", "deletion; the protein becomes shorter", "nondisjunction; the cell gains an extra chromosome"], "type": "mc", "k": "IkEi"}, {"n": 20, "stem": "Which mutation is most likely to be passed on to a person's children?", "opts": ["a mutation in a skin cell caused by UV light", "a mutation in a lung cell caused by cigarette smoke", "a mutation in a cell that will develop into a sperm or egg", "a mutation in a muscle cell caused by an injury"], "type": "mc", "k": "IkMi"}, {"n": 21, "stem": "Claim: Brothers and sisters with the same two parents are genetically different from each other. Which <b>TWO</b> statements are the best evidence for this claim?", "opts": ["During meiosis, crossing over exchanges segments between homologous chromosomes.", "Mitosis produces two daughter cells that are identical to the parent cell.", "Homologous chromosome pairs line up randomly during meiosis I (independent assortment).", "DNA replication makes an exact copy of the DNA before division.", "Ribosomes translate mRNA into proteins."], "type": "ms", "k": "IkEsIEMi"}]}, {"code": "SB2c", "title": "Biotechnology uses and ethics", "short": "Biotechnology and ethics", "items": [{"n": 22, "stem": "DNA from a crime scene and three suspects was cut with the same restriction enzyme and run on a gel. The table lists the band sizes in base pairs.", "table": {"header": ["Sample", "Bands (base pairs)"], "rows": [["Crime scene", "500, 350, 200, 100"], ["Suspect 1", "500, 300, 200"], ["Suspect 2", "500, 350, 200, 100"], ["Suspect 3", "450, 350, 150, 100"]]}, "q": "Which suspect's DNA matches the crime scene sample?", "opts": ["Suspect 1", "Suspect 2", "Suspect 3", "none of the suspects"], "type": "mc", "k": "IkIi"}, {"n": 23, "stem": "Scientists insert the human insulin gene into a bacterial plasmid, and the bacteria begin making human insulin. Why does this work?", "opts": ["Bacteria naturally make insulin, and the plasmid only speeds it up.", "The plasmid turns the bacteria into human cells.", "Insulin is a lipid that bacteria already store.", "All organisms share the same genetic code, so bacterial ribosomes translate the human gene into the same protein."], "type": "mc", "k": "IkQi"}, {"n": 24, "stem": "A farmer is deciding whether to plant Bt corn, which is genetically modified to make its own insecticide protein. Which is a valid scientific or ethical concern to raise?", "opts": ["Insect pests could evolve resistance, and the gene could spread to related wild plants, so long-term monitoring is needed.", "Bt corn cannot be eaten by any animal, including livestock.", "Bt corn will make every plant in the area genetically identical.", "Genetically modified crops have no possible benefits."], "type": "mc", "k": "IkEi"}]}, {" function complete(it){
  const v=given(it);
  if(it.type==="ms") return Array.isArray(v)&&v.length===2;
  if(it.type==="order") return Array.isArray(v)&&v.length===4&&v.every(Boolean);
  return !!v;
}
function correct(it){
  const k=dec(it.k), v=given(it);
  if(it.type==="ms") return Array.isArray(v) && [...v].sort().join(", ")===k;
  if(it.type==="order") return Array.isArray(v) && v.join(", ")===k;
  return v===k;
}

// ---------- header ----------
function who(){
  const w=document.getElementById("who");
  if(!S.student){ w.innerHTML=""; return; }
  w.innerHTML=`<div><b>${esc(S.student.name)}</b></div><div>${esc(S.student.teacher)} · Period ${esc(S.student.period)}</div><button class="linkbtn" id="switch">Not you? Switch student</button>`;
  document.getElementById("switch").onclick=()=>{
    if(!confirm("Switch student? This clears the answers saved in this browser.")) return;
    S={student:null,dom:1,tab:"ideas",ans:{},sub:{},queue:S.queue}; save(); render();
  };
}

// ---------- sign-in ----------
function gate(m){
  m.innerHTML=`<div class="gate"><h2 style="font-size:1.4rem">Sign in</h2>
    <p class="small" style="margin:0">Use the same name every time so your teacher can match your scores.</p>
    <label>First and last name<input id="g-name" autocomplete="name" placeholder="First Last"></label>
    <div class="row"><label>Teacher's last name<input id="g-teacher" placeholder="Teacher"></label>
    <label>Period<input id="g-period" inputmode="numeric" placeholder="1"></label></div>
    <div class="err" id="g-err"></div>
    <div><button class="btn" id="g-go">Start</button></div></div>`;
  document.getElementById("g-go").onclick=()=>{
    const name=document.getElementById("g-name").value.replace(/\s+/g," ").trim();
    const teacher=document.getElementById("g-teacher").value.replace(/\s+/g," ").trim();
    const period=document.getElementById("g-period").value.trim();
    const err=document.getElementById("g-err");
    if(name.split(" ").length<2){ err.textContent="Enter your first and last name."; return; }
    if(!teacher){ err.textContent="Enter your teacher's last name."; return; }
    if(!period){ err.textContent="Enter your class period."; return; }
    S.student={name,teacher,period}; save(); render();
  };
}

// ---------- blueprint ----------
function bp(){
  return `<nav class="bp" aria-label="Domains by percent of the EOC">${DATA.map(d=>`<button class="seg s${d.num}" data-d="${d.num}" aria-current="${S.dom===d.num&&S.tab!=="results"}">
    <span class="pct">${BP[d.num]}%</span><span class="nm">${esc(d.title)}</span>${S.sub[d.num]?`<span class="done">${S.sub[d.num].score}/${S.sub[d.num].possible}</span>`:""}</button>`).join("")}</nav>
    <div class="bpnote">Block width = share of the EOC. Do one domain at a time: read the Key Ideas, answer every question, then submit.</div>`;
}

// ---------- render ----------
function render(){
  who();
  const m=document.getElementById("main");
  if(!S.student){ gate(m); return; }
  const app=document.getElementById("app");
  app.style.setProperty("--dc",`var(--d${S.dom})`); app.style.setProperty("--dt",`var(--d${S.dom}t)`);
  const d=dom(S.dom), its=items(d), answered=its.filter(complete).length, sub=S.sub[d.num];
  m.innerHTML = bp()+`
    <div class="dhead"><div><div class="eyebrow">Domain ${d.num} · ${esc(d.stds)}</div><h2>${esc(d.title)}</h2></div>
      <div class="dstats"><div><b>${BP[d.num]}%</b>of the EOC</div><div><b id="ans-count">${answered}/${its.length}</b>answered</div><div><b>${sub?sub.score+"/"+sub.possible:"--"}</b>submitted score</div></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="ideas" aria-selected="${S.tab==="ideas"}">Key Ideas</button>
      <button class="tab" role="tab" data-t="practice" aria-selected="${S.tab==="practice"}">Questions</button>
      <button class="tab results" role="tab" data-t="results" aria-selected="${S.tab==="results"}">My Results</button>
    </div><section id="pane"></section>`;
  m.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{ S.dom=+b.dataset.d; if(S.tab==="results") S.tab="ideas"; save(); render(); scrollTo({top:0,behavior:"smooth"}); });
  m.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; save(); render(); });
  const pane=document.getElementById("pane");
  if(S.tab==="ideas") ideas(d,pane); else if(S.tab==="practice") practice(d,pane); else results(pane);
}

function ideas(d,pane){
  pane.innerHTML=`<div class="keybox"><h3>Key ideas to know</h3><ul>${d.key.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
   <div class="elist">${d.elements.map(e=>`<div class="erow"><span class="code">${e.code}</span><span>${esc(e.title)}</span></div>`).join("")}</div>
   <div style="margin-top:18px"><button class="btn" id="go">Start the ${d.count} questions</button></div>`;
  document.getElementById("go").onclick=()=>{ S.tab="practice"; save(); render(); };
}

function table(t){ return `<div class="tscroll"><table><thead><tr>${t.header.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }

function qhtml(it,locked){
  const v=given(it); let body="";
  if(it.type==="order"){
    const letters=it.opts.map(o=>o[0]);
    body=`<div class="ord">${it.opts.map(([k,t])=>`<div class="ordrow"><b>${k}</b><span>${esc(t)}</span></div>`).join("")}</div>
     <div class="ordsel">Order: ${[0,1,2,3].map(i=>`<select data-pos="${i}" aria-label="Step ${i+1}" ${locked?"disabled":""}><option value="">${["1st","2nd","3rd","4th"][i]}</option>${letters.map(x=>`<option ${v&&v[i]===x?"selected":""}>${x}</option>`).join("")}</select>${i<3?"→":""}`).join(" ")}</div>`;
  } else {
    const multi=it.type==="ms";
    body=(multi?`<div class="hint">Select exactly TWO.</div>`:"")+`<fieldset class="opts">${it.opts.map((o,i)=>{ const Lt=L[i], on=multi?(v||[]).includes(Lt):v===Lt;
      return `<label class="opt" data-L="${Lt}"><input type="${multi?"checkbox":"radio"}" name="q${it.n}" value="${Lt}" ${on?"checked":""} ${locked?"disabled":""}><span><span class="L">${Lt}.</span>${esc(o)}</span></label>`; }).join("")}</fieldset>`;
  }
  let mark="";
  if(locked){ const ok=correct(it); mark=`<span class="mark ${ok?"m-ok":"m-bad"}">${ok?"Correct":"Incorrect"}</span>`; }
  return `<article class="q" data-n="${it.n}"><div class="qhead"><span class="qnum">Question ${it.n}</span><span class="tag">${it.el}</span>${mark}</div>
    <div class="stem"><p>${rich(it.stem)}</p>${it.table?table(it.table):""}${it.q?`<p>${esc(it.q)}</p>`:""}${it.work?`<div class="scratch">Use scratch paper to draw the Punnett square.</div>`:""}</div>${body}</article>`;
}

function practice(d,pane){
  const locked=!!S.sub[d.num];
  let html="";
  if(locked){ const s=S.sub[d.num]; html+=`<div class="banner ${s.score/s.possible>=.8?"ok":s.score/s.possible>=.6?"warn":"bad"}"><b>Submitted: ${s.score} of ${s.possible}</b><span>Green questions are correct and red are incorrect. Open My Results to see which skills to review. ${sendText(d.num)}</span></div>`; }
  d.elements.forEach(e=>{
    html+=`<div class="elh"><span class="code">${e.code}</span><h3>${esc(e.title)}</h3></div>`;
    if(e.lead) html+=`<div class="lead"><p style="margin:0 0 6px">${esc(e.lead.text)}</p>${table(e.lead.table)}${e.lead.sketch?`<div class="scratch">Sketch the cladogram on scratch paper.</div>`:""}</div>`;
    e.items.forEach(it=>html+=qhtml(Object.assign({el:e.code},it),locked));
  });
  html+= locked
    ? `<div class="submitbar"><button class="btn ghost" id="retry">Try this domain again</button><span class="small">Your teacher sees your newest attempt.</span></div>`
    : `<div class="submitbar"><button class="btn" id="submit" disabled>Submit Domain ${d.num}</button><span class="small" id="left"></span></div>`;
  pane.innerHTML=html;

  if(locked){
    pane.querySelectorAll(".q").forEach(q=>{ const n=+q.dataset.n, it=items(d).find(x=>x.n===n);
      if(it.type!=="order") q.querySelectorAll(".opt").forEach(o=>{ if(o.querySelector("input").checked) o.classList.add(correct(it)?"picked-ok":"picked-bad"); }); });
    document.getElementById("retry").onclick=()=>{
      if(!confirm("Clear your answers for this domain and try again? Your teacher will see your new score.")) return;
      items(d).forEach(it=>delete S.ans[it.n]); delete S.sub[d.num]; save(); render(); scrollTo({top:0});
    };
    return;
  }
  const upd=()=>{ const left=items(d).filter(it=>!complete(it)).length;
    document.getElementById("submit").disabled=left>0;
    document.getElementById("left").textContent=left?`${left} question${left>1?"s":""} left to answer.`:"All questions answered. Check your work, then submit.";
    const c=document.getElementById("ans-count"); if(c) c.textContent=`${items(d).length-left}/${items(d).length}`; };
  pane.querySelectorAll(".q").forEach(q=>{
    const n=+q.dataset.n, it=items(d).find(x=>x.n===n);
    q.addEventListener("change",()=>{
      if(it.type==="order") S.ans[n]=[...q.querySelectorAll("select")].map(s=>s.value);
      else if(it.type==="ms"){ const v=[...q.querySelectorAll("input:checked")].map(x=>x.value); S.ans[n]=v;
        q.querySelectorAll("input").forEach(x=>{ if(!x.checked) x.disabled=v.length>=2; }); }
      else S.ans[n]=(q.querySelector("input:checked")||{}).value;
      save(); upd();
    });
    if(it.type==="ms"){ const v=S.ans[n]||[]; q.querySelectorAll("input").forEach(x=>{ if(!x.checked) x.disabled=v.length>=2; }); }
  });
  upd();
  document.getElementById("submit").onclick=()=>submitDomain(d);
}

function elementScores(d){ const o={}; d.elements.forEach(e=>{ o[e.code]=e.items.filter(it=>correct(it)).length; }); return o; }

function submitDomain(d){
  const its=items(d);
  if(its.some(it=>!complete(it))) return;
  if(!confirm(`Submit Domain ${d.num}? Your scores will go to your teacher.`)) return;
  const es=elementScores(d), score=Object.values(es).reduce((a,b)=>a+b,0);
  const payload={studentName:S.student.name, teacher:S.student.teacher, period:S.student.period, domain:d.num,
    elementScores:es, missed:its.filter(it=>!correct(it)).map(it=>`Q${it.n} (${it.el})`),
    answers:Object.fromEntries(its.map(it=>[it.n,[].concat(S.ans[it.n]).join("")])), clientTime:new Date().toISOString()};
  S.sub[d.num]={score,possible:d.count,es,sent:false,at:Date.now()};
  S.queue.push({id:Date.now()+"-"+d.num,dom:d.num,payload});
  save(); render(); scrollTo({top:0}); flush();
}

function sendText(n){ const s=S.sub[n]; if(!s) return "";
  return s.sent?`<span class="sendstate" style="color:var(--ok)">Sent to your teacher.</span>`:`<span class="sendstate" style="color:var(--warn)">Not sent yet. Stay connected to the internet; it will send automatically.</span>`; }

let flushing=false;
async function flush(){
  if(flushing||!S.queue.length) return;
  if(!/^https:\/\/script\.google\.com\//.test(SHEETS_URL)){ console.warn("SHEETS_URL is not set"); return; }
  flushing=true;
  while(S.queue.length){
    const job=S.queue[0];
    try{
      await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(job.payload)});
      S.queue.shift(); if(S.sub[job.dom]) S.sub[job.dom].sent=true; save();
    }catch(e){ break; }
  }
  flushing=false; render();
}
addEventListener("online",flush);
setInterval(flush,30000);

function results(pane){
  let tot=0,pos=0;
  const rows=DATA.map(d=>{ const s=S.sub[d.num]; if(s){tot+=s.score;pos+=s.possible;}
    return `<div class="rdom" style="--dc:var(--d${d.num});--dt:var(--d${d.num}t)"><h3>Domain ${d.num}: ${esc(d.title)} ${s?`<span class="tag">${s.score}/${s.possible}</span>`:""}</h3>
      ${d.elements.map(e=>{ const v=s?s.es[e.code]:null;
        const pill=v==null?`<span class="pill p-none">Not submitted</span>`:v>=3?`<span class="pill p-sec">Secure</span>`:v===2?`<span class="pill p-dev">Review</span>`:`<span class="pill p-int">Get help</span>`;
        return `<div class="rrow"><span class="code">${e.code}</span><span class="rname">${esc(e.short)}</span><span class="dots">${[0,1,2].map(i=>`<i class="${v!=null&&i<v?"on":""}"></i>`).join("")}</span>${pill}</div>`; }).join("")}
      ${s?`<div class="small" style="margin-top:6px">${sendText(d.num)}</div>`:""}</div>`; }).join("");
  pane.innerHTML=`<p style="margin-top:0">You have submitted <b>${Object.keys(S.sub).length} of 5</b> domains${pos?`, for <b>${tot} of ${pos}</b> points`:""}. <b>Secure</b> = 3 of 3. <b>Review</b> = 2 of 3: reread that skill's Key Ideas. <b>Get help</b> = 0 or 1 of 3: ask your teacher to reteach that skill.</p>${rows}`;
}

render(); flush();
})();
</script>
</body>
</html>
